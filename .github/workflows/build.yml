name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest,     target: aarch64-apple-darwin,      goos: darwin,  goarch: arm64 }
          - { runner: macos-latest,     target: x86_64-apple-darwin,       goos: darwin,  goarch: amd64 }
          # ubuntu-22.04 keeps the glibc requirement low (2.35) so the .so loads on older distros too
          - { runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  goos: linux,   goarch: amd64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, goos: linux,   goarch: arm64 }
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,    goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --release --locked

      - name: Build and package
        run: scripts/package.sh ${{ matrix.target }} ${{ matrix.goos }} ${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zip-*
          merge-multiple: true

      # CPA's plugin store installer requires exactly these assets:
      #   <id>_<version>_<goos>_<goarch>.zip  (library at the zip root) + checksums.txt (sha256sum format)
      - name: Checksums
        run: cd dist && sha256sum *.zip > checksums.txt && cat checksums.txt

      # gh instead of a release action: uploads retry (GitHub sometimes answers an asset upload with a 5xx),
      # and re-running the job on an existing release replaces the assets without touching its notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"; repo="$GITHUB_REPOSITORY"
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$repo" --title "$tag" --generate-notes --verify-tag
          for f in dist/*.zip dist/checksums.txt; do
            for i in 1 2 3 4 5; do
              gh release upload "$tag" "$f" -R "$repo" --clobber && break
              [ "$i" = 5 ] && exit 1
              echo "upload of $f failed, retry $i"; sleep $((i * 10))
            done
          done
          gh release edit "$tag" -R "$repo" --draft=false
