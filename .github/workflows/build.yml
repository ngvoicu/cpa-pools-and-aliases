name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, goos: darwin, goarch: arm64 }
          - { runner: macos-latest, goos: darwin, goarch: amd64 }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cc: x86_64-w64-mingw32-gcc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$(cat VERSION)"; exit 1; }

      - name: Install MinGW
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Build and package
        run: make package GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} ${{ matrix.cc && format('CC={0}', matrix.cc) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zip-*
          merge-multiple: true

      # CPA's plugin store installer requires exactly these assets:
      #   <id>_<version>_<goos>_<goarch>.zip  (library at the zip root) + checksums.txt (sha256sum format)
      - name: Checksums
        run: cd dist && sha256sum *.zip > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
